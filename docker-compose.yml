services:
  postgres:
    image: postgres:16-alpine
    # Sized for the 8 GB / 4 vCPU server; each value can be overridden in .env. Explained in docs/runbooks/performance.md.
    command:
      - postgres
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-2GB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-5GB}
      - -c
      - work_mem=${PG_WORK_MEM:-16MB}
      - -c
      - maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-512MB}
      - -c
      - random_page_cost=${PG_RANDOM_PAGE_COST:-1.1}
      - -c
      - effective_io_concurrency=${PG_EFFECTIVE_IO_CONCURRENCY:-200}
      - -c
      - max_parallel_workers_per_gather=${PG_MAX_PARALLEL_WORKERS_PER_GATHER:-2}
      - -c
      - log_min_duration_statement=${PG_LOG_MIN_DURATION_STATEMENT:-500ms}
    shm_size: ${PG_SHM_SIZE:-1g}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-elinor_iq}
      POSTGRES_USER: ${POSTGRES_USER:-elinor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-elinor} -d ${POSTGRES_DB:-elinor_iq}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  backend:
    # Named explicitly (= Compose's default name for project "elinor-iq") so pulse-scheduler can reuse it.
    image: elinor-iq-backend
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      args:
        APT_MIRROR: ${APT_MIRROR:-}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
    volumes:
      - ./backend:/app
      - ./backups:/backups
      - ./source:/source:ro
      - ./docker/backend-entrypoint.sh:/entrypoint.sh:ro
      - pulse_media:/pulse-media:ro  # Pulse covers: served read-only; only pulse-scheduler writes
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=5)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - ./docker/frontend-entrypoint.sh:/entrypoint.sh:ro
    depends_on:
      - backend
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const fs=require('fs'); const debug=['1','true','yes'].includes(String(process.env.DJANGO_DEBUG||'').toLowerCase()); if(!debug) process.exit(fs.existsSync('/app/dist/index.html')?0:1); fetch('http://127.0.0.1:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1));",
        ]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    environment:
      DOMAIN: ${DOMAIN:-}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
    volumes:
      - ./docker/nginx-entrypoint.sh:/nginx-entrypoint.sh:ro
      - ./docker/certbot/www:/var/www/certbot
      - ./docker/certbot/conf:/etc/letsencrypt
      - ./frontend/dist:/var/www/frontend:ro
    entrypoint: ["/bin/sh", "/nginx-entrypoint.sh"]
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    restart: unless-stopped

  scheduler:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      args:
        APT_MIRROR: ${APT_MIRROR:-}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
    volumes:
      - ./backend:/app
      # Mounted like backend-entrypoint.sh: a scheduler change takes effect on restart, without an image rebuild.
      - ./docker/scheduler-entrypoint.sh:/scheduler-entrypoint.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/scheduler-entrypoint.sh"]
    restart: unless-stopped

  pulse-scheduler:
    # Same image as backend, built once; the update.sh fallback (--no-build) then still has an image for it.
    image: elinor-iq-backend
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
    volumes:
      - ./backend:/app
      - ./docker/pulse-scheduler-entrypoint.sh:/pulse-scheduler-entrypoint.sh:ro
      - pulse_media:/pulse-media
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/pulse-scheduler-entrypoint.sh"]
    restart: unless-stopped

volumes:
  postgres_data:
  frontend_node_modules:
  pulse_media:
