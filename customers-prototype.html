<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>

  <style>
    :root, [data-theme="dark"] {
      color-scheme: dark;
      --bg: #06080d;
      --surface: rgba(12, 16, 23, 0.86);
      --elevated: #131924;
      --ink: #f8fafc;
      --muted: #94a3b8;
      --faint: #7c8aa0;
      --line: rgba(255, 255, 255, 0.08);
      --hover: rgba(255, 255, 255, 0.045);
      --accent: #3b82f6;
      --on-accent: #ffffff;
      --danger: #fb7185;
      --warning: #fbbf24;
      --ok: #34d399;
      --frame: #18202c;
      --glow-1: rgba(59, 130, 246, 0.15);
      --glow-2: rgba(16, 185, 129, 0.12);
      --glow-3: rgba(139, 92, 246, 0.10);
      --shadow: 0 24px 48px -18px rgba(0, 0, 0, 0.65);
      --online: #60a5fa;
      --sari: #34d399;
      --gorgan: #fbbf24;
      --capri: #a78bfa;
      --scrim: rgba(0, 0, 0, 0.55);
    }
    [data-theme="light"] {
      color-scheme: light;
      --bg: #f1f5f9;
      --surface: rgba(255, 255, 255, 0.94);
      --elevated: #f8fafc;
      --ink: #090d16;
      --muted: #475569;
      --faint: #64748b;
      --line: rgba(15, 23, 42, 0.10);
      --hover: rgba(15, 23, 42, 0.04);
      --accent: #2563eb;
      --on-accent: #ffffff;
      --danger: #e11d48;
      --warning: #b45309;
      --ok: #047857;
      --frame: #cbd5e1;
      --glow-1: rgba(59, 130, 246, 0.08);
      --glow-2: rgba(16, 185, 129, 0.06);
      --glow-3: rgba(139, 92, 246, 0.05);
      --shadow: 0 16px 36px -16px rgba(15, 23, 42, 0.18);
      --online: #1d4ed8;
      --sari: #047857;
      --gorgan: #b45309;
      --capri: #6d28d9;
      --scrim: rgba(15, 23, 42, 0.35);
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      font-family: Vazirmatn, sans-serif;
      background: var(--bg);
      color: var(--ink);
      font-feature-settings: "ss01", "ss02";
      -webkit-font-smoothing: antialiased;
    }
    button, input, select { font-family: inherit; color: inherit; }
    button { cursor: pointer; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .tabular { font-variant-numeric: tabular-nums; }
    .aurora {
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background:
        radial-gradient(1100px 550px at 85% -10%, var(--glow-1), transparent 60%),
        radial-gradient(900px 500px at 15% 105%, var(--glow-2), transparent 55%),
        radial-gradient(700px 450px at 50% 45%, var(--glow-3), transparent 65%),
        var(--bg);
    }

    .book {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 28px;
      box-shadow: var(--shadow), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(18px);
    }
    [data-theme="light"] .book { box-shadow: var(--shadow), inset 0 1px 0 #fff; }

    .side-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 28px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(18px);
    }

    .nav-link {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; min-height: 44px; padding: 8px 14px; border-radius: 16px;
      color: var(--muted); text-decoration: none; font-size: 12px; font-weight: 600;
    }
    .nav-link.active { background: var(--accent); color: var(--on-accent); }
    .nav-link .count {
      font-size: 10px; padding: 2px 8px; border-radius: 999px;
      background: var(--elevated); color: var(--muted); border: 1px solid var(--line);
    }
    .nav-link.active .count { background: rgba(255,255,255,0.18); color: white; border-color: transparent; }

    .page-title { margin: 0; font-size: 28px; font-weight: 600; letter-spacing: -0.03em; line-height: 1.25; }
    .lede { margin: 6px 0 0; max-width: 46rem; color: var(--muted); font-size: 14px; line-height: 1.7; }

    .seg { display: inline-flex; padding: 4px; border-radius: 16px; background: var(--elevated); border: 1px solid var(--line); }
    .seg button {
      min-height: 40px; padding: 0 16px; border: 0; border-radius: 12px; background: transparent;
      color: var(--muted); font-size: 13px; font-weight: 600;
    }
    .seg button[aria-selected="true"] { background: var(--accent); color: var(--on-accent); }

    .field, .select, .chip, .text-btn, .primary-quiet {
      min-height: 44px; border-radius: 14px; border: 1px solid var(--line); background: var(--elevated);
    }
    .field {
      width: 100%; padding: 0 14px; font-size: 14px;
      appearance: none; -webkit-appearance: none;
    }
    .search-wrap.has-query .field { padding-inline-end: 40px; }
    .field::placeholder { color: var(--faint); }
    .select { padding: 0 12px; font-size: 13px; font-weight: 600; }
    .chip, .text-btn, .primary-quiet {
      padding: 0 14px; font-size: 13px; font-weight: 600; color: var(--muted);
    }
    .chip[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: transparent; }
    .text-btn:disabled, .primary-quiet:disabled { opacity: 0.45; cursor: not-allowed; }
    .tool-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .search-wrap { position: relative; flex: 1 1 280px; max-width: 420px; min-width: 220px; }
    .search-wrap .field { padding-inline: 14px; }
    .clear-q {
      position: absolute; inset-inline-end: 6px; top: 6px; width: 32px; height: 32px;
      border: 0; border-radius: 10px; background: transparent; color: var(--muted);
    }

    .ledger-head, .person {
      display: grid;
      grid-template-columns: minmax(170px, 1.4fr) 108px minmax(130px, 1fr) 104px minmax(220px, 1.15fr) 76px 84px;
      gap: 12px; align-items: center;
    }
    .ledger-head {
      padding: 0 18px 10px; color: var(--faint); font-size: 12px; font-weight: 600;
    }
    .person {
      position: relative; width: 100%; text-align: right; padding: 12px 18px;
      border: 0; border-top: 1px solid var(--line); background: transparent; color: inherit;
    }
    .person:hover, .person[aria-current="true"], .buy-row:hover { background: var(--hover); }
    .buy-row {
      display: grid; width: 100%; text-align: right; gap: 8px; align-items: center;
      padding: 12px 18px; border: 0; border-top: 1px solid var(--line); background: transparent; color: inherit;
    }
    .spine {
      position: absolute; inset-inline-start: 10px; top: 14px; bottom: 14px; width: 4px; border-radius: 99px;
    }
    .spine.vip { background: linear-gradient(#f6e7c1, #a67c2d); }
    .spine.diamond { background: linear-gradient(#f7fafc, #8ea0b5); }
    .spine.gold { background: linear-gradient(#f3d98a, #b8860b); }
    .spine.gold2 { background: linear-gradient(#e7c56a, #8a6814); }
    .spine.silver { background: linear-gradient(#eef2f6, #7e8c99); }
    .spine.bronze { background: linear-gradient(#e4b48f, #8d5a34); }
    .spine.bronze2 { background: linear-gradient(#d0a07a, #6f4932); }
    .spine.bronze3 { background: linear-gradient(#c49678, #5c4033); }
    .spine.none { background: var(--line); }
    .spine.operator { background: var(--warning); }
    .who strong { display: block; font-size: 14px; font-weight: 600; }
    .who span, .sub { display: block; margin-top: 2px; color: var(--muted); font-size: 12px; }
    .who.fallback strong { color: var(--faint); font-weight: 500; }
    .money { font-size: 13px; font-weight: 600; }
    .lines { display: flex; flex-wrap: nowrap; gap: 4px; }
    .line {
      font-style: normal; font-size: 11px; font-weight: 600; line-height: 1;
      padding: 4px 7px; border-radius: 999px; color: var(--faint);
      background: transparent; box-shadow: inset 0 0 0 1px var(--line);
    }
    .line.on { color: var(--c); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) 55%, transparent); background: color-mix(in srgb, var(--c) 14%, transparent); }
    .status { font-size: 12px; font-weight: 600; }
    .status.ok { color: var(--ok); }
    .status.off { color: var(--faint); }
    .status.warn { color: var(--warning); }
    .open-label { font-size: 13px; font-weight: 600; color: var(--accent); }

    .book-scroll { overflow-x: auto; }
    .book-scroll .ledger-head, .book-scroll .person { min-width: 980px; }

    .pager { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 18px 4px; color: var(--muted); font-size: 13px; }
    .pager button { min-height: 44px; min-width: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--elevated); }

    .empty { padding: 48px 24px; text-align: center; }
    .empty h2 { margin: 0; font-size: 18px; font-weight: 600; }
    .empty p { margin: 8px 0 0; color: var(--muted); font-size: 14px; }

    .note { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.6; }
    .split {
      display: flex; height: 14px; border-radius: 999px; overflow: hidden; background: var(--elevated);
      box-shadow: inset 0 0 0 1px var(--line);
    }
    .split .buy { background: var(--accent); }
    .split .reg { background: color-mix(in srgb, var(--muted) 55%, transparent); }
    .split .op { background: var(--warning); }
    .meter { height: 8px; border-radius: 99px; background: var(--elevated); overflow: hidden; }
    .meter i { display: block; height: 100%; border-radius: inherit; background: var(--faint); }
    .meter i.vip { background: #c6a15b; }
    .meter i.diamond { background: #9aafc4; }
    .meter i.gold, .meter i.gold2 { background: #c4922a; }
    .meter i.silver { background: #8b98a6; }
    .meter i.bronze, .meter i.bronze2, .meter i.bronze3 { background: #a56b45; }

    .dossier {
      position: relative; width: min(420px, 100%); max-height: 100%;
      padding: 22px; overflow: auto; color: var(--ink);
      border: 1px solid var(--line); border-radius: 28px; box-shadow: var(--shadow);
      background: #121820;
    }
    [data-theme="light"] .dossier { background: #ffffff; }
    .dossier h2 { margin: 8px 0 0; font-size: 26px; font-weight: 600; letter-spacing: -0.03em; }
    .facts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; }
    .fact { min-width: 0; padding: 12px; border-radius: 16px; background: var(--hover); }
    .fact.wide { grid-column: 1 / -1; }
    .fact span { display: block; color: var(--faint); font-size: 12px; }
    .fact strong { display: block; margin-top: 4px; font-size: 15px; font-weight: 600; overflow-wrap: anywhere; }
    .scrim {
      position: absolute; inset: 0; z-index: 5; display: flex; justify-content: flex-end;
      padding: 16px; background: var(--scrim);
    }
    .icon-btn {
      width: 44px; height: 44px; border-radius: 14px; border: 1px solid var(--line); background: var(--elevated); color: var(--ink);
    }

    .mobile-frame {
      width: 390px; height: 780px; border-radius: 48px; overflow: hidden; position: relative;
      background: var(--bg); box-shadow: 0 0 0 12px var(--frame), 0 30px 80px -15px rgba(0,0,0,0.5);
    }
    .island { width: 122px; height: 30px; margin: 11px auto 4px; border-radius: 22px; background: #000; }
    .phone-scroll { height: calc(100% - 45px); overflow: auto; padding: 8px 14px 108px; }
    .dock {
      position: absolute; inset-inline: 12px; bottom: 12px; z-index: 4;
      display: flex; justify-content: space-around; align-items: center;
      min-height: 64px; padding: 6px; border-radius: 32px;
      background: color-mix(in srgb, var(--surface) 92%, transparent);
      border: 1px solid var(--line); backdrop-filter: blur(20px);
    }
    .dock a, .dock span {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 2px; min-width: 44px; min-height: 44px; color: var(--muted);
      font-size: 10px; font-weight: 600; text-decoration: none;
    }
    .dock .on { color: var(--accent); }

    .m-person {
      position: relative; display: block; width: 100%; text-align: right; padding: 14px 16px 14px 14px;
      border: 0; border-top: 1px solid var(--line); background: transparent; color: inherit;
    }
    .m-person:first-child { border-top: 0; }
    .sheet {
      position: absolute; inset: 0; z-index: 6; background: var(--scrim);
      display: flex; align-items: flex-end;
    }
    .sheet-backdrop { position: absolute; inset: 0; border: 0; background: transparent; }
    .sheet-card {
      position: relative; z-index: 1; width: 100%; max-height: 86%; overflow: auto; padding: 18px 16px 28px;

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>

      { id: 18876, name: "", mobile: "", tier: "", purchases: 1, amount: 1850000, first: "۱۴۰۵/۰۷/۰۱", last: "۱۴۰۵/۰۷/۰۱", online: 1, pos: 0, lines: ["online"], status: "فعال", incomplete: true },
    ];

    const fa = new Intl.NumberFormat("fa-IR");
    const state = {
      view: "desktop",
      tab: "list",
      q: "",
      population: "all",
      tier: "",
      lines: [],
      advanced: false,
      minP: "",
      maxP: "",
      page: 1,
      perPage: 8,
      selected: null,
      detailKey: null,
      sheet: false,
      toast: "",
    };

    function esc(value) {
      return String(value ?? "").replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
    }
    function num(value) { return fa.format(value); }
    function toman(value) { return value == null ? "—" : `${num(value)} تومان`; }
    function tierOf(id) { return TIERS.find((tier) => tier.id === id); }
    function displayName(person) {
      return person.name ? person.name : "مشتری بدون نام";
    }
    function isBuyer(person) { return person.purchases > 0 && !person.operator; }
    function isRegisteredOnly(person) { return person.purchases === 0 && !person.operator; }
    function metal(person) {
      if (person.operator) return "operator";
      return tierOf(person.tier)?.metal || "none";
    }
    function tierLabel(person) {
      if (person.operator) return person.operator;
      return tierOf(person.tier)?.label || "—";
    }
    function filtered() {
      return PEOPLE.filter((person) => {
        const query = state.q.trim();
        if (query && !`${displayName(person)} ${person.mobile || ""}`.includes(query)) return false;
        if (state.population === "purchasing" && !isBuyer(person)) return false;
        if (state.population === "registered" && !isRegisteredOnly(person)) return false;
        if (state.tier && person.tier !== state.tier) return false;
        if (state.lines.length && !state.lines.every((line) => person.lines.includes(line))) return false;
        if (state.minP && person.purchases < Number(state.minP)) return false;
        if (state.maxP && person.purchases > Number(state.maxP)) return false;
        return true;
      });
    }
    function hasFilters() {
      return Boolean(state.q || state.population !== "all" || state.tier || state.lines.length || state.minP || state.maxP);
    }

    function lineMarks(person) {
      return LINES.map((line) => {
        const on = person.lines.includes(line.id) ? "on" : "";
        return `<i class="line ${on}" style="--c:${line.color}">${esc(line.label)}</i>`;
      }).join("");
    }
    function statusClass(person) {
      if (person.incomplete) return "warn";
      if (person.status === "فعال") return "ok";
      return "off";
    }
    function statusText(person) {
      return person.incomplete ? "اطلاعات ناقص" : person.status;
    }

    function filtersHtml(compact) {
      const pops = [
        ["all", "همه"],
        ["purchasing", "خریدار"],
        ["registered", "بدون خرید"],
      ];
      const chips = pops.map(([id, label]) =>
        `<button type="button" class="chip" data-pop="${id}" aria-pressed="${state.population === id}">${label}</button>`
      ).join("");
      const tiers = [`<option value="">سطح مشتری</option>`].concat(
        TIERS.map((tier) => `<option value="${tier.id}" ${state.tier === tier.id ? "selected" : ""}>${esc(tier.label)}</option>`)
      ).join("");
      const lines = LINES.map((line) =>
        `<button type="button" class="chip" data-line="${line.id}" aria-pressed="${state.lines.includes(line.id)}">${esc(line.label)}</button>`
      ).join("");
      const advanced = state.advanced ? `
        <div class="tool-row" style="margin-top:8px">
          <input id="desk-min" class="field" style="max-width:140px" inputmode="numeric" data-bound="minP" placeholder="حداقل خرید" value="${esc(state.minP)}" aria-label="حداقل خرید">
          <input id="desk-max" class="field" style="max-width:140px" inputmode="numeric" data-bound="maxP" placeholder="حداکثر خرید" value="${esc(state.maxP)}" aria-label="حداکثر خرید">
        </div>` : "";
      return `
        <div class="tool-row" style="margin-top:14px">
          <div class="search-wrap ${state.q ? "has-query" : ""}">
            <input id="${compact ? "phone" : "desk"}-search" class="field" type="text" enterkeyhint="search" placeholder="نام یا موبایل" value="${esc(state.q)}" aria-label="جستجو نام یا موبایل" data-bound="q">
            ${state.q ? `<button type="button" class="clear-q" data-action="clear-q" aria-label="پاک کردن جستجو">×</button>` : ""}
          </div>
          ${compact ? `<button type="button" class="text-btn" data-action="sheet">فیلتر</button>` : `<button type="button" class="text-btn" data-action="reset" ${hasFilters() ? "" : "disabled"}>بازنشانی فیلترها</button>`}
        </div>
        ${compact ? "" : `
          <div class="tool-row" style="margin-top:8px">
            ${chips}
            <select id="desk-tier" class="select" data-bound="tier" aria-label="سطح مشتری">${tiers}</select>
            ${lines}
            <button type="button" class="text-btn" data-action="advanced" aria-expanded="${state.advanced}">${state.advanced ? "فیلتر کمتر" : "فیلتر بیشتر"}</button>
          </div>
          ${advanced}
          ${state.lines.length > 1 ? `<p class="note" style="margin-top:8px">با انتخاب چند خط فروش، فقط مشتریانی می‌آیند که از همه همان خط‌ها خرید داشته‌اند.</p>` : ""}
        `}
      `;
    }

    function listHtml(compact) {
      const rows = filtered();
      const pages = Math.max(1, Math.ceil(rows.length / state.perPage));
      if (state.page > pages) state.page = pages;
      const slice = rows.slice((state.page - 1) * state.perPage, state.page * state.perPage);
      const body = rows.length === 0
        ? `<div class="empty"><h2>مشتری‌ای با این شرایط پیدا نشد.</h2><p>${hasFilters() ? "جستجو یا فیلتر دیگری را امتحان کنید." : "هنوز مشتری‌ای در سامانه ثبت نشده است."}</p></div>`
        : compact
          ? slice.map((person) => `
              <button type="button" class="m-person" data-open="${person.id}" ${state.selected === person.id ? 'aria-current="true"' : ""}>
                <span class="spine ${metal(person)}"></span>
                <span class="who ${person.name ? "" : "fallback"}"><strong>${esc(displayName(person))}</strong><span dir="ltr">${esc(person.mobile || "اطلاعات ناقص")}</span></span>
                <span class="sub" style="margin-top:8px">${esc(tierLabel(person))} · آخرین خرید ${esc(person.last || "ثبت نشده")}</span>
                <span class="money tabular" style="display:block;margin-top:4px">${toman(person.amount)}</span>
                <span class="lines" style="margin-top:8px">${lineMarks(person)}</span>
              </button>`).join("")
          : `
            <div class="ledger-head"><span>مشتری</span><span>سطح</span><span>خرید</span><span>آخرین خرید</span><span>خطوط فروش</span><span>وضعیت</span><span>شناسنامه</span></div>
            ${slice.map((person) => `
              <button type="button" class="person" data-open="${person.id}" ${state.selected === person.id ? 'aria-current="true"' : ""}>
                <span class="spine ${metal(person)}"></span>
                <span class="who ${person.name ? "" : "fallback"}"><strong>${esc(displayName(person))}</strong><span dir="ltr">${esc(person.mobile || "اطلاعات ناقص")}</span></span>
                <span>${esc(tierLabel(person))}</span>
                <span><strong class="tabular">${num(person.purchases)}</strong><span class="sub tabular">${toman(person.amount)}</span></span>
                <span class="tabular">${esc(person.last || "—")}</span>
                <span class="lines">${lineMarks(person)}</span>
                <span class="status ${statusClass(person)}">${esc(statusText(person))}</span>
                <span class="open-label">شناسنامه</span>
              </button>`).join("")}
          `;
      return `
        ${filtersHtml(compact)}
        <p class="note" id="${compact ? "phone" : "desk"}-status" style="margin-top:10px" role="status">${esc(state.toast || `${num(rows.length)} مشتری`)}</p>
        <div class="book" style="margin-top:12px;padding:14px 0 16px">
          <div class="${compact ? "" : "book-scroll"}">${body}</div>
          <div class="pager">
            <span class="tabular">صفحه ${num(state.page)} از ${num(pages)}</span>
            <span>
              <button type="button" data-action="prev" ${state.page <= 1 ? "disabled" : ""} aria-label="صفحه قبل">قبلی</button>
              <button type="button" data-action="next" ${state.page >= pages ? "disabled" : ""} aria-label="صفحه بعد">بعدی</button>
            </span>
          </div>
        </div>
      `;
    }

    function reportsHtml() {
      const buyers = PEOPLE.filter(isBuyer).length;
      const registered = PEOPLE.filter(isRegisteredOnly).length;
      const operators = PEOPLE.filter((person) => person.operator).length;
      const total = PEOPLE.length;
      const tierCounts = TIERS.map((tier) => PEOPLE.filter((person) => person.tier === tier.id).length);
      const tierMax = Math.max(...tierCounts, 1);
      const tierRows = TIERS.map((tier, index) => {
        const count = tierCounts[index];
        const width = Math.round((count / tierMax) * 100);
        return `<div style="display:grid;grid-template-columns:108px 1fr 28px;gap:10px;align-items:center;margin-top:10px">
          <span style="font-size:13px">${esc(tier.label)}</span>
          <span class="meter" aria-hidden="true"><i class="${tier.metal}" style="width:${width}%"></i></span>
          <span class="tabular" style="font-size:13px">${num(count)}</span>
        </div>`;
      }).join("");
      const lineRows = LINES.map((line) => {
        const count = PEOPLE.filter((person) => person.lines.includes(line.id) && !person.operator).length;
        return `<div class="fact"><span>${esc(line.label)}</span><strong class="tabular">${num(count)} مشتری</strong></div>`;
      }).join("");
      return `
        <section class="book" style="margin-top:16px;padding:22px">
          <h2 style="margin:0;font-size:20px;font-weight:600">ترکیب مشتریان</h2>
          <p class="lede">از ${num(total)} نفر، ${num(buyers)} نفر خرید داشته‌اند و ${num(registered)} نفر فقط ثبت شده‌اند.</p>
          <div class="split" style="margin-top:16px" role="img" aria-label="${num(buyers)} خریدار، ${num(registered)} بدون خرید، ${num(operators)} اپراتور">
            <span class="buy" style="flex:${buyers} 1 0"></span>
            <span class="reg" style="flex:${registered} 1 8px"></span>
            <span class="op" style="flex:${operators} 1 8px"></span>
          </div>
          <p class="note" style="margin-top:10px">${num(operators)} حساب اپراتور در شمارش مشتری و سطح‌بندی نمی‌آید.</p>
        </section>
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-top:12px">
          <section class="book" style="padding:18px 20px 20px">
            <h2 style="margin:0;font-size:16px;font-weight:600">سطح‌ها</h2>
            ${tierRows}
          </section>
          <section class="book" style="padding:18px 20px 20px">
            <h2 style="margin:0;font-size:16px;font-weight:600">خط فروشی که استفاده شده</h2>
            <div class="facts">${lineRows}</div>
          </section>
        </div>
      `;
    }

    function pageHtml(compact) {
      const tabs = `
        <div class="seg" role="tablist" style="margin-top:16px">
          <button type="button" role="tab" data-tab="list" aria-selected="${state.tab === "list"}">لیست مشتریان</button>
          <button type="button" role="tab" data-tab="reports" aria-selected="${state.tab === "reports"}">گزارش مشتریان</button>
        </div>`;
      if (state.selected) {
        const person = PEOPLE.find((item) => item.id === state.selected);
        if (person) return personPage(person, compact);
      }
      return `
        <div style="display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;align-items:flex-end;margin-top:${compact ? "4px" : "14px"}">
          <div>
            <h1 class="page-title" style="${compact ? "font-size:24px" : ""}">مشتریان</h1>
          </div>
          ${compact ? "" : `<div class="tool-row">
            <button type="button" class="primary-quiet" data-action="export">خروجی اکسل</button>
            <button type="button" class="primary-quiet" data-action="tiers">به‌روزرسانی سطح‌ها</button>
          </div>`}
        </div>
        ${tabs}
        ${state.tab === "reports" ? reportsHtml() : listHtml(compact)}
      `;
    }

    const CATALOG = [
      ["مانتو کتی شانتون", "مشکی", "۴۴"],
      ["پیراهن میدی ساتن", "یشمی", "۳۸"],
      ["کت لینن", "کرم", "۴۰"],
      ["شلوار بگ", "ذغالی", "۴۲"],
      ["شال ابریشم", "سرمه‌ای", "—"],
    ];
    const PAST_DATES = ["۱۴۰۵/۰۶/۰۲", "۱۴۰۵/۰۴/۱۸", "۱۴۰۴/۱۲/۰۹", "۱۴۰۴/۰۹/۲۱", "۱۴۰۴/۰۶/۱۴"];

    function axisScores(person) {
      const maxPurchases = Math.max(...PEOPLE.map((item) => item.purchases), 1);
      const maxAmount = Math.max(...PEOPLE.map((item) => item.amount || 0), 1);
      const fresh = !person.last ? 0 : person.status === "غیرفعال" ? 0.22 : person.last.includes("۰۷") ? 1 : person.last.includes("۰۶") ? 0.78 : person.last.includes("۱۴۰۵") ? 0.55 : 0.28;
      return [
        { label: "تکرار", value: person.purchases / maxPurchases },
        { label: "مبلغ", value: (person.amount || 0) / maxAmount },
        { label: "تازگی", value: fresh },
        { label: "خط‌ها", value: person.lines.length / LINES.length },
        { label: "آنلاین", value: person.purchases ? person.online / person.purchases : 0 },
        { label: "حضوری", value: person.purchases ? person.pos / person.purchases : 0 },
      ];
    }

    function radarSvg(scores) {
      const cx = 150;
      const cy = 132;
      const radius = 84;
      const point = (index, scale) => {
        const angle = -Math.PI / 2 + (index * 2 * Math.PI) / scores.length;
        return [cx + Math.cos(angle) * radius * scale, cy + Math.sin(angle) * radius * scale];
      };
      const ring = (scale) => scores.map((_, index) => point(index, scale).map((n) => n.toFixed(1)).join(",")).join(" ");
      const rings = [0.25, 0.5, 0.75, 1].map((scale) => `<polygon points="${ring(scale)}" fill="none" stroke="var(--line)" />`).join("");
      const spokes = scores.map((_, index) => {
        const [x, y] = point(index, 1);
        return `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--line)" />`;
      }).join("");
      const shape = scores.map((score, index) => point(index, Math.max(score.value, 0.03)).map((n) => n.toFixed(1)).join(",")).join(" ");
      const dots = scores.map((score, index) => {
        const [x, y] = point(index, Math.max(score.value, 0.03));
        return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.5" fill="var(--accent)" />`;
      }).join("");
      const labels = scores.map((score, index) => {
        const [x, y] = point(index, 1.32);
        return `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="middle" dominant-baseline="middle" fill="var(--muted)" font-size="12" font-family="Vazirmatn, sans-serif">${esc(score.label)}</text>`;
      }).join("");
      const caption = scores.map((score) => `${score.label} ${num(Math.round(score.value * 100))}`).join("، ");
      return `<svg viewBox="0 0 300 268" width="100%" height="268" role="img" aria-label="نمودار ۳۶۰. ${esc(caption)}">${rings}${spokes}<polygon points="${shape}" fill="color-mix(in srgb, var(--accent) 28%, transparent)" stroke="var(--accent)" stroke-width="2"></polygon>${dots}${labels}</svg>`;
    }

    function purchaseRows(person) {
      if (!person.purchases || !person.lines.length) return [];
      const count = Math.min(person.purchases, 5);
      return Array.from({ length: count }, (_, index) => {
        const item = CATALOG[(person.id + index) % CATALOG.length];
        const line = person.lines[index % person.lines.length];
        const share = person.amount ? Math.round((person.amount / person.purchases) * [1.35, 0.72, 1.05, 0.48, 0.9][index]) : null;
        return {
          key: `${person.id}-${index}`,
          date: index === 0 ? person.last : PAST_DATES[index - 1],
          line,
          product: item[0],
          color: item[1],
          size: item[2],
          qty: 1 + (index % 2),
          amount: share,
        };
      });
    }

    function profileOf(person) {
      if (person.operator) {
        return { email: "", gender: "", national: "", birth: "", city: "ساری", address: "صندوق شعبه ساری", postal: "" };
      }
      if (person.incomplete || !person.name) {
        return { email: "", gender: "", national: "", birth: "", city: "", address: "", postal: "" };
      }
      const city = person.lines.includes("gorgan") ? "گرگان" : person.lines.includes("sari") || person.lines.includes("capri") ? "ساری" : "تهران";
      return {
        email: `customer${person.id}@elinor.shop`,
        gender: "زن",
        national: String(1000000000 + (person.id % 900000000)),
        birth: "۱۳۷۴/۰۶/۱۲",
        city,
        address: city === "تهران" ? "ونک، خیابان خدامی، پلاک ۱۸" : `بلوار اصلی ${city}، پلاک ${person.id % 80}`,
        postal: String(1400000000 + person.id),
      };
    }

    function rhythm(person) {
      const labels = ["اردیبهشت", "خرداد", "تیر", "مرداد", "شهریور", "مهر"];
      if (!person.purchases) return labels.map((label) => ({ label, value: 0 }));
      const pattern = [2, 1, 2, 1, 3, 4];
      const scale = Math.max(person.purchases / 12, 0.4);
      return labels.map((label, index) => ({ label, value: Math.max(0, Math.round(pattern[index] * scale)) }));
    }

    function personPage(person, compact) {
      const scores = axisScores(person);
      const rows = purchaseRows(person);
      const profile = profileOf(person);
      const bars = rhythm(person);
      const maxBar = Math.max(...bars.map((bar) => bar.value), 1);
      const itemsSold = person.purchases ? Math.round(person.purchases * 1.35) : 0;
      const discount = person.amount && !person.operator ? Math.round((person.amount / Math.max(person.purchases, 1)) * 0.08) : 0;
      const columns = compact ? "1fr" : "minmax(280px, 0.92fr) minmax(0, 1.08fr)";
      const purchases = rows.length
        ? rows.map((row) => {
            const open = state.detailKey === row.key;
            const line = LINES.find((item) => item.id === row.line);
            return `
              <button type="button" class="buy-row" data-buy="${row.key}" aria-expanded="${open}" style="grid-template-columns:${compact ? "1fr auto" : "120px 88px 1fr 72px 120px"}">
                <span class="tabular">${esc(row.date)}</span>
                <span class="line on" style="--c:${line ? line.color : "var(--faint)"};justify-self:start">${esc(line ? line.label : "")}</span>
                ${compact ? "" : `<span>${esc(row.product)}</span>`}
                <span class="tabular">${num(row.qty)}</span>
                <span class="tabular" style="white-space:nowrap">${row.amount ? toman(row.amount) : "—"}</span>
              </button>
              ${open ? `<div class="fact" style="margin:0 16px 8px"><span>${esc(row.product)}</span><strong>${esc(row.color)} · سایز ${esc(row.size)} · ${num(row.qty)} عدد</strong></div>` : ""}
            `;
          }).join("")
        : `<div class="empty"><h2>خریدی ثبت نشده است.</h2><p>ثبت‌نام به‌تنهایی سابقه خرید نمی‌سازد.</p></div>`;
      const productMap = new Map();
      rows.forEach((row) => {
        const current = productMap.get(row.product) || { qty: 0, times: 0, last: row.date };
        current.qty += row.qty;
        current.times += 1;
        productMap.set(row.product, current);
      });
      const products = [...productMap.entries()];
      return `
        <button type="button" class="text-btn" data-action="back">بازگشت به مشتریان</button>
        <div style="margin-top:14px" class="book">
          <div style="padding:22px 22px 8px">
            <h1 class="page-title ${person.name ? "" : "who fallback"}">${esc(displayName(person))}</h1>
            <p class="note" dir="ltr" style="text-align:right;margin-top:6px">${esc(person.mobile || "اطلاعات ناقص")}</p>
            <p class="note" style="margin-top:8px">${esc(tierLabel(person))} · ${esc(statusText(person))}</p>
            ${person.operator ? `<p class="note" style="margin-top:8px">این حساب دفتر ثبت سفارش است و در سطح‌بندی مشتری نمی‌آید.</p>` : ""}
          </div>
        </div>
        <div style="display:grid;grid-template-columns:${columns};gap:12px;margin-top:12px">
          <section class="book" style="padding:18px 18px 8px">
            <h2 style="margin:0 0 4px;font-size:16px;font-weight:600">نمودار ۳۶۰</h2>
            ${person.purchases ? radarSvg(scores) : `<div class="empty"><h2>نموداری ساخته نشد.</h2><p>هنوز خریدی برای مقایسه ثبت نشده است.</p></div>`}
          </section>
          <section class="book" style="padding:18px 20px 20px">
            <h2 style="margin:0;font-size:16px;font-weight:600">خلاصه</h2>
            <div class="facts">
              <div class="fact"><span>تعداد خرید</span><strong class="tabular">${num(person.purchases)}</strong></div>
              <div class="fact"><span>تعداد اقلام</span><strong class="tabular">${num(itemsSold)}</strong></div>
              <div class="fact"><span>خرید آنلاین</span><strong class="tabular">${num(person.online)}</strong></div>
              <div class="fact"><span>خرید حضوری</span><strong class="tabular">${num(person.pos)}</strong></div>
              <div class="fact wide"><span>مبلغ خرید</span><strong class="tabular">${toman(person.amount)}</strong></div>
              <div class="fact"><span>اولین خرید</span><strong>${esc(person.first || "ثبت نشده")}</strong></div>
              <div class="fact"><span>آخرین خرید</span><strong>${esc(person.last || "ثبت نشده")}</strong></div>
            </div>
            <h2 style="margin:18px 0 10px;font-size:16px;font-weight:600">ریتم خرید</h2>
            <div style="display:grid;grid-template-columns:repeat(6,1fr);gap:8px;align-items:end;height:92px">
              ${bars.map((bar) => `<div style="display:flex;flex-direction:column;justify-content:flex-end;height:100%;gap:6px">
                <div style="height:${Math.max(4, (bar.value / maxBar) * 64)}px;border-radius:8px 8px 3px 3px;background:${bar.value ? "var(--accent)" : "var(--line)"}"></div>
                <span style="font-size:10px;color:var(--faint);text-align:center">${esc(bar.label)}</span>
              </div>`).join("")}
            </div>
          </section>
        </div>
        <section class="book" style="margin-top:12px;padding:18px 8px 12px">
          <h2 style="margin:0 18px 4px;font-size:16px;font-weight:600">سوابق خرید</h2>
          ${rows.length && person.purchases > rows.length ? `<p class="note" style="margin:0 18px 10px">${num(rows.length)} مورد اخیر از ${num(person.purchases)} خرید</p>` : `<div style="height:10px"></div>`}
          ${purchases}
        </section>
        <div style="display:grid;grid-template-columns:${columns};gap:12px;margin-top:12px">
          <section class="book" style="padding:18px 20px 16px">
            <h2 style="margin:0 0 8px;font-size:16px;font-weight:600">محصولات</h2>
            ${products.length ? products.map(([name, info]) => `<div class="fact" style="margin-top:8px"><span>${esc(name)}</span><strong class="tabular">${num(info.qty)} عدد · ${num(info.times)} بار</strong></div>`).join("") : `<p class="note">محصولی ثبت نشده است.</p>`}
          </section>
          <section class="book" style="padding:18px 20px 16px">
            <h2 style="margin:0 0 8px;font-size:16px;font-weight:600">خطوط فروش</h2>
            <div class="facts">
              ${LINES.map((line) => {
                const used = person.lines.includes(line.id);
                const count = used ? (line.id === "online" ? person.online : Math.max(1, Math.round(person.pos / Math.max(person.lines.filter((id) => id !== "online").length, 1)))) : 0;
                return `<div class="fact"><span>${esc(line.label)}</span><strong class="tabular">${used ? `${num(count)} خرید` : "بدون خرید"}</strong></div>`;
              }).join("")}
            </div>
          </section>
        </div>
        <div style="display:grid;grid-template-columns:${columns};gap:12px;margin-top:12px">
          <section class="book" style="padding:18px 20px 8px">
            <h2 style="margin:0 0 8px;font-size:16px;font-weight:600">مشخصات</h2>
            ${[
              ["ایمیل", profile.email],
              ["جنسیت", profile.gender],
              ["کد ملی", profile.national],
              ["تاریخ تولد", profile.birth],
            ].map(([label, value]) => `<div class="fact" style="margin-top:8px"><span>${label}</span><strong dir="${label === "ایمیل" || label === "کد ملی" ? "ltr" : "rtl"}">${esc(value || "ثبت نشده")}</strong></div>`).join("")}
          </section>
          <section class="book" style="padding:18px 20px 16px">
            <h2 style="margin:0 0 8px;font-size:16px;font-weight:600">آدرس و تخفیف</h2>
            <div class="fact"><span>${esc(profile.city || "شهر")}</span><strong>${esc(profile.address || "آدرسی ثبت نشده است")}</strong></div>
            <div class="fact" style="margin-top:8px"><span>تخفیف ثبت‌شده</span><strong class="tabular">${discount ? toman(discount) : "تخفیفی ثبت نشده است"}</strong></div>
          </section>
        </div>
      `;
    }

    function sheetHtml() {
      if (!state.sheet) return "";
      const pops = [["all", "همه"], ["purchasing", "خریدار"], ["registered", "بدون خرید"]];
      const tiers = [`<option value="">همه سطح‌ها</option>`].concat(
        TIERS.map((tier) => `<option value="${tier.id}" ${state.tier === tier.id ? "selected" : ""}>${esc(tier.label)}</option>`)
      ).join("");
      return `
        <div class="sheet">
          <button type="button" class="sheet-backdrop" data-action="close-sheet" aria-label="بستن فیلتر"></button>
          <div class="sheet-card" role="dialog" aria-label="فیلتر مشتریان">
            <div style="display:flex;justify-content:space-between;align-items:center">
              <h2 style="margin:0;font-size:18px">فیلتر</h2>
              <button type="button" class="icon-btn" data-action="close-sheet" aria-label="بستن فیلتر">بستن</button>
            </div>
            <div class="tool-row" style="margin-top:14px">
              ${pops.map(([id, label]) => `<button type="button" class="chip" data-pop="${id}" aria-pressed="${state.population === id}">${label}</button>`).join("")}
            </div>
            <select id="sheet-tier" class="select" style="margin-top:10px;width:100%" data-bound="tier" aria-label="سطح مشتری">${tiers}</select>
            <div class="tool-row" style="margin-top:10px">
              ${LINES.map((line) => `<button type="button" class="chip" data-line="${line.id}" aria-pressed="${state.lines.includes(line.id)}">${esc(line.label)}</button>`).join("")}
            </div>
            <div class="tool-row" style="margin-top:10px">
              <input id="sheet-min" class="field" inputmode="numeric" data-bound="minP" placeholder="حداقل خرید" value="${esc(state.minP)}" aria-label="حداقل خرید">
              <input id="sheet-max" class="field" inputmode="numeric" data-bound="maxP" placeholder="حداکثر خرید" value="${esc(state.maxP)}" aria-label="حداکثر خرید">
            </div>
            <p class="note" style="margin-top:10px">چند خط فروش با هم یعنی مشتری باید از همه آن خط‌ها خرید کرده باشد.</p>
            <div class="tool-row" style="margin-top:14px">
              <button type="button" class="text-btn" data-action="reset">بازنشانی فیلترها</button>
              <button type="button" class="primary-quiet" data-action="export">خروجی اکسل</button>
              <button type="button" class="primary-quiet" data-action="tiers">به‌روزرسانی سطح‌ها</button>
            </div>
          </div>
        </div>`;
    }

    function render() {
      const active = document.activeElement;
      const activeId = active && active.id;
      const caret = active && typeof active.selectionStart === "number" ? active.selectionStart : null;
      document.getElementById("desk-mount").innerHTML = pageHtml(false);
      document.getElementById("phone-mount").innerHTML = pageHtml(true);
      document.getElementById("desk-dossier").innerHTML = "";
      document.getElementById("phone-dossier").innerHTML = "";
      document.getElementById("phone-sheet").innerHTML = state.selected ? "" : sheetHtml();
      if (activeId) {
        const next = document.getElementById(activeId);
        if (next) {
          next.focus();
          if (caret != null && next.setSelectionRange) next.setSelectionRange(caret, caret);
        }
      }
    }

    function setState(patch) {
      Object.assign(state, patch);
      render();
    }

    document.body.addEventListener("click", (event) => {
      const pop = event.target.closest("[data-pop]");
      const line = event.target.closest("[data-line]");
      const tab = event.target.closest("[data-tab]");
      const open = event.target.closest("[data-open]");
      const buy = event.target.closest("[data-buy]");
      const action = event.target.closest("[data-action]");
      if (pop) {
        setState({ population: pop.dataset.pop, page: 1 });
        return;
      }
      if (line) {
        const id = line.dataset.line;
        const lines = state.lines.includes(id) ? state.lines.filter((item) => item !== id) : state.lines.concat(id);
        setState({ lines, page: 1 });
        return;
      }
      if (tab) {
        setState({ tab: tab.dataset.tab, selected: null, sheet: false });
        return;
      }
      if (open) {
        setState({ selected: Number(open.dataset.open), sheet: false, detailKey: null });
        window.scrollTo(0, 0);
        const scroller = document.getElementById("phone-scroll");
        if (scroller) scroller.scrollTop = 0;
        return;
      }
      if (buy) {
        const key = buy.dataset.buy;
        setState({ detailKey: state.detailKey === key ? null : key });
        return;
      }
      if (!action) return;
      const name = action.dataset.action;
      if (name === "reset" || name === "clear-q") {
        setState({ q: "", population: "all", tier: "", lines: [], minP: "", maxP: "", advanced: false, page: 1, toast: "" });
      } else if (name === "advanced") {
        setState({ advanced: !state.advanced });
      } else if (name === "sheet") {
        setState({ sheet: true, selected: null });
      } else if (name === "close-sheet") {
        setState({ sheet: false });
      } else if (name === "back" || name === "close") {
        setState({ selected: null, detailKey: null });
        window.scrollTo(0, 0);
      } else if (name === "prev") {
        setState({ page: Math.max(1, state.page - 1) });
      } else if (name === "next") {
        setState({ page: state.page + 1 });
      } else if (name === "export" || name === "tiers") {
        setState({ toast: "" });
      }
    });

    document.body.addEventListener("input", (event) => {
      const bound = event.target.dataset.bound;
      if (!bound) return;
      const value = bound === "minP" || bound === "maxP" ? event.target.value.replace(/[^\d]/g, "") : event.target.value;
      setState({ [bound]: value, page: 1, toast: "" });
    });

    document.body.addEventListener("change", (event) => {
      if (event.target.dataset.bound === "tier") setState({ tier: event.target.value, page: 1 });
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") setState({ sheet: false, detailKey: null });
    });

    document.getElementById("view-desktop-btn").addEventListener("click", () => switchView("desktop"));
    document.getElementById("view-mobile-btn").addEventListener("click", () => switchView("mobile"));
    document.getElementById("theme-btn").addEventListener("click", toggleTheme);

    function switchView(mode) {
      state.view = mode;
      document.getElementById("desktop-container").style.display = mode === "desktop" ? "" : "none";
      document.getElementById("mobile-container").style.display = mode === "mobile" ? "flex" : "none";
      document.getElementById("view-desktop-btn").className = mode === "desktop"
        ? "px-3 py-1.5 rounded-xl text-xs font-semibold bg-blue-600 text-white"
        : "px-3 py-1.5 rounded-xl text-xs font-semibold text-slate-600 dark:text-slate-300";
      document.getElementById("view-mobile-btn").className = mode === "mobile"
        ? "px-3 py-1.5 rounded-xl text-xs font-semibold bg-blue-600 text-white"
        : "px-3 py-1.5 rounded-xl text-xs font-semibold text-slate-600 dark:text-slate-300";
    }

    function toggleTheme() {
      const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      document.documentElement.classList.toggle("dark", next === "dark");
      document.getElementById("theme-btn").textContent = next === "dark" ? "حالت روشن" : "حالت تاریک";
    }

    document.documentElement.classList.add("dark");
    render();
  </script>
</body>
</html>
